<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>图片管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#334155;font:15px/1.6 system-ui}header,main{max-width:1100px;margin:auto;padding:20px}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:22px;margin:0 auto 0 0}a{color:#2563eb}button,input,select{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:8px 12px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}article{border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;background:white}article img{display:block;width:100%;height:220px;object-fit:cover;cursor:zoom-in;background:#e2e8f0}article label{display:flex;align-items:center;gap:7px;padding:10px;overflow-wrap:anywhere}#status{min-height:24px}dialog{max-width:min(94vw,500px);border:1px solid #cbd5e1;border-radius:14px;padding:22px}dialog::backdrop{background:#0f172a99}#viewer{padding:0;background:#0f172a;border:0;max-width:100vw;max-height:100vh;width:100vw;height:100vh}#viewer img{display:block;width:100%;height:100%;object-fit:contain}#viewer button{position:absolute;right:15px;top:15px}#more{display:block;margin:24px auto}#login p{color:#b91c1c}@media(max-width:480px){header,main{padding:14px}#grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}article img{height:190px}}
</style>
<script defer src="/gallery.js"></script>
</head>
<body>
<header><a href="/">返回聊天</a><h1>图片管理</h1><select id="filter" aria-label="角色筛选"><option value="">全部角色</option></select><button id="clear" hidden>清空此角色</button><button id="delete" disabled>删除所选</button><button id="refresh">刷新</button></header>
<main><p id="status" role="status" aria-live="polite"></p><div id="grid"></div><button id="more" hidden>加载更多</button></main>
<dialog id="login"><form><h2>访问验证</h2><input type="password" autocomplete="current-password" aria-label="同步密码" required><p role="status"></p><button>继续</button></form></dialog>
<dialog id="viewer"><img alt="原图"><button autofocus>关闭</button></dialog>
</body></html>
